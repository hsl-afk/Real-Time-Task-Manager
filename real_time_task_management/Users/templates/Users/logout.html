<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logging out... | Real-Time Task Manager</title>
</head>
<body>
    <p id="msg">Logging out, please wait...</p>

    <script>
        async function logout() {
            const refreshToken = localStorage.getItem('refresh_token');
            const msgEl = document.getElementById('msg');

            if (!refreshToken) {
                // No token found — already logged out
                msgEl.textContent = 'You are already logged out. Redirecting...';
                setTimeout(() => window.location.replace('/login/'), 1000);
                return;
            }

            try {
                const res = await fetch('/api/logout/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh: refreshToken }),
                });

                const data = await res.json();

                // Always clear local tokens regardless of server response
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');

                if (data.success) {
                    msgEl.textContent = 'Logged out successfully. Redirecting...';
                } else {
                    msgEl.textContent = 'Session ended. Redirecting...';
                }
            } catch (err) {
                // Even on network error, clear tokens locally
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                msgEl.textContent = 'Logged out. Redirecting...';
            }

            setTimeout(() => window.location.replace('/login/'), 1000);
        }

        // Run immediately on page load
        logout();
    </script>
</body>
</html>
